你看了一眼他发来的名单。`,choices:[{text:"好，全部招进来",effects:{progress:-3,morale:-2,budget:8,bossTrust:1,qualityDebt:5},hidden:{judgment:-1},result:"老板很满意，给你批了额外的预算作为补充。HR开始批量面试。你看着那份推荐名单，把它夹进了文件里。",action:"large"},{text:"人不是越多越好，我只招2个关键岗位",effects:{progress:3,morale:2,budget:-2,bossTrust:-1},hidden:{judgment:1},result:"老板接受了你的精打细算。花了点政治资本，至少把规模压下来了。预算也被卡了一点。",action:"small"}]},gm={id:"hire_reveal",name:"新人磨合结束",emoji:"🎲",color:"#a78bfa",tagline:"「培训期结束了。」",situation:"新人开始独立作业，这几周你也看清楚了："},Wu=[{id:"dreamer",name:"幻想家",emoji:"✨",color:"#c084fc",tagline:"「我想实现的时候一定会进展顺利」",situation:"幻想家找到你，眼神发亮：",dialogue:"制作人！我昨晚想到了一个超酷的功能——城市建造系统+NPC情绪引擎+实时动态天气！直接对标最近很火的那个猛男捡树枝！我问了朋友，实现起来应该不难的！",choices:[{text:"好主意！加进去！",effects:{progress:-3,morale:-5,budget:8,bossTrust:1,qualityDebt:8},hidden:{judgment:-1},result:"范围扩了，进度变慢，但是预算变高了。团队觉得你是一个耳根子很软的制作人。"},{text:"先写进愿望清单",effects:{progress:3,morale:-4,budget:-1,bossTrust:-2},hidden:{honesty:1},result:"一切如常，幻想家有点失落，私下里说你很会画饼。他离开时没有说再见。"},{text:"做完核心玩法再说",effects:{progress:2,morale:5,budget:-5,bossTrust:-1},hidden:{judgment:1,quality:1},result:"幻想家郁闷地走了。团队很欣赏你的坚定。但上面觉得你不愿突破。"}]},{id:"impulse",name:"灵机一动",emoji:"💡",color:"#fbbf24",tagline:"「我最近玩了一个这个，我们也加一下」",situation:"灵机一动冲进办公室，手机屏幕冲你晃：",dialogue:"我最近在玩《原X》，好可爱！我们也做一个向导角色！还有《白神话》的变身机制！都加上吧！",choices:[{text:"好！美术程序都动起来！",effects:{progress:-2,morale:-8,budget:10,bossTrust:1,qualityDebt:5},hidden:{judgment:-1},result:"美术组和程序组加班加点，团队疲惫不堪。但你们折腾出来的效果为你们换到了一笔预算。"},{text:"做个可行性评估",effects:{progress:-1,morale:-2,budget:-4,bossTrust:3},hidden:{judgment:1,honesty:1},result:"结论：都不可行。浪费了点时间和钱，但总比全做强。"},{text:"我们有自己的方向，专注",effects:{progress:3,morale:-6,budget:-2,bossTrust:1},hidden:{judgment:1},result:"他有点受伤，但项目没偏轨。"}]},{id:"castle",name:"空中楼阁",emoji:"🏰",color:"#38bdf8",tagline:"「先做出来再说，验证是其次」",situation:"空中楼阁把你叫进小会议室，压低声音：",dialogue:"下个月没有内部PV，就拿不到下季度预算！我不管你验证没验证完，先做一版漂亮的Demo出来！",choices:[{text:"好，全员停下来做Demo",effects:{progress:-8,morale:-3,budget:12,bossTrust:2,qualityDebt:20},hidden:{honesty:-1},result:"预算到手了——虽然没要的那么多。核心问题被埋进去，以后会爆的。"},{text:"据理力争拒绝",effects:{progress:2,morale:5,budget:-12,bossTrust:2},hidden:{honesty:1,grit:1},result:"预算缩水了，但进度和士气都保住了。"},{text:"把现有进度包装成Demo",effects:{progress:-3,morale:3,budget:3,bossTrust:-2,qualityDebt:8},hidden:{honesty:-1},result:"小聪明发挥了作用，上面暂时满意了。"}]},{id:"paratrooper",name:"伞兵",emoji:"🪂",color:"#4ade80",tagline:"「我不会乱动的」（但一定会的）",situation:"空降的这位执行制作人听说是老板花了大价钱挖来的，他在全员会议上笑着说：",dialogue:"大家好！我是新来的执行制作人，会辅助制作人把这个内容做好。我觉得你们做得挺好的，会尽量不动大家的东西。对了，我只是有一些小小的方向性调整……",choices:[{text:"当然！洗耳恭听！",effects:{progress:-6,morale:-6,budget:8,bossTrust:3,qualityDebt:5},hidden:{grit:-1},result:"「小小调整」= 三个月白干，方向大变。士气大受挫败，但上面很满意新的效果，批了更多预算。"},{text:"先完成当前里程碑再谈",effects:{progress:5,morale:-3,budget:-3,bossTrust:-3},hidden:{grit:1},result:"争取到了缓冲期。但他记住这事了。从此看你的眼神都多了三分敌意。预算也被卡了。"},{text:"邀请他深入了解实际现状",effects:{progress:2,morale:3,budget:-3,bossTrust:-1},hidden:{people:1},result:"他理解了现状，后来的调整合理了很多。团队觉得你会办事。"}]},{id:"perfectionist",name:"完美主义",emoji:"♾️",color:"#f87171",tagline:"「我们需要重构代码」",situation:"主程发来一份十页技术文档：",dialogue:"制作人，我研究了一下现有架构，技术债非常严重。如果不在这个阶段重构，后期每个功能的开发成本会翻倍。大概需要……六周。",choices:[{text:"重构！代码质量第一！",effects:{progress:-8,morale:10,budget:-8,bossTrust:1,qualityDebt:-10},hidden:{quality:1},result:"六周后代码看起来似乎是干净了，但你看见程序组有几个人看你的目光有点躲闪。"},{text:"局部重构最关键的部分",effects:{progress:-3,morale:5,budget:-5,bossTrust:1,qualityDebt:-3},hidden:{quality:1},result:"折中方案，程序组勉强接受。进度基本没动。"},{text:"先上线，后续版本再还债",effects:{progress:5,morale:-8,budget:3,bossTrust:2,qualityDebt:10},hidden:{honesty:-1},result:"程序组心碎，但项目在往前走。上面挺满意的。"}]},{id:"preacher",name:"布道者",emoji:"📋",color:"#2dd4bf",tagline:"「先建立一套完善的文档流」",situation:"布道者在群里发了一条很长的消息：",dialogue:"继续开发之前，我们应该先对齐需求文档的格式规范，建立完善文档体系。我安排了一个两天的全员工作坊……",choices:[{text:"全员参加！规范很重要！",effects:{progress:-4,morale:5,budget:-8,bossTrust:2},hidden:{quality:1},result:"规范建好了。没有一个人照着用。但大家觉得被尊重了。"},{text:"出个简版规范就好",effects:{progress:-1,morale:-2,budget:-3,bossTrust:1},hidden:{judgment:1},result:"执行率30%，但总比没有强。三方都不满意。"},{text:"这个阶段结束了再搞",effects:{progress:3,morale:-5,budget:0,bossTrust:-1},hidden:{quality:-1},result:"布道者很失望。进度稳住了，但流程债留着了。"}]},{id:"firefighter",name:"救火队",emoji:"🚒",color:"#fb923c",tagline:"「借你50%的美术几个月」",situation:"来自上级的通知：",dialogue:"N项目下个月上线，严重缺人，需要从你们组抽调50%的美术支援三个月。你们的开发计划自行调整一下。",choices:[{text:"以大局为重，送人",effects:{progress:-8,morale:-5,budget:8,bossTrust:3},hidden:{grit:-1},result:"美术走了，但上面记了你的配合。给了点预算补偿。三个月的空档期，还是很难熬。"},{text:"据理力争，只给20%",effects:{progress:-3,morale:2,budget:-5,bossTrust:1},hidden:{grit:1},result:"谈判部分成功，损失减半。上面不太高兴，但团队知道你替他们争取了。"},{text:"换延期批复+资源补偿",effects:{progress:-2,morale:-2,budget:8,bossTrust:-2},hidden:{judgment:1},result:"批了延期，补了点预算。进度算保住了。"}]},{id:"quitter",name:"减员",emoji:"🧳",color:"#94a3b8",tagline:"「我要离开这个伤心的城市」",situation:"核心程序员发来私信：",dialogue:"制作人……我想辞职。我跟女朋友分手了，在这个城市实在待不下去了。战斗系统我会交接好的。",choices:[{text:"升职加薪挽留！",effects:{progress:2,morale:6,budget:-15,bossTrust:-1},hidden:{people:1},result:"他留下来了，进度也稳了。但钱花出去了，心还没完全回来。"},{text:"祝福他，认真做好交接",effects:{progress:-2,morale:-3,budget:-5,bossTrust:3},hidden:{honesty:1,people:1},result:"交接花了三周，新人熟悉又花了一个月。人走了，活儿耽误了。但上面说处理得体。"},{text:"给他批一个月调整假",effects:{progress:-2,morale:10,budget:-8,bossTrust:-1},hidden:{people:1,grit:1},result:"他回来了，状态超好。团队对你刮目相看。"}]},{id:"blamer",name:"甩锅侠",emoji:"🥏",color:"#a78bfa",tagline:"「不是功能没做好，是需求没提清楚」",situation:"程序和策划在项目群里对线起来了：",dialogue:"「功能做错了，两周白费！」「需求文档写得清清楚楚！」「没人看那个破文档！」两边都来找你投诉对方。",choices:[{text:"站程序：策划需求要更清晰",effects:{progress:2,morale:-8,budget:2,bossTrust:-1},hidden:{people:-1},result:"策划崩溃。进度正常推进，但他们开始消极怠工。上面觉得你偏心。"},{text:"站策划：程序要主动沟通",effects:{progress:0,morale:-6,budget:3,bossTrust:-2},hidden:{people:-1},result:"程序组寒心，开始只按字面意思做需求，进度也慢了点。"},{text:"拉双方当面对齐，建沟通机制",effects:{progress:-3,morale:8,budget:-5,bossTrust:1},hidden:{people:1,judgment:1},result:"握手言和，建立了每周小对齐机制。这周白费了，但长远受益。"}]},{id:"cowboy",name:"自由发挥",emoji:"🤠",color:"#f97316",tagline:"「我这么设计，耽误你的需求吗？」",situation:"主美做完了一个月的UI给你看效果：",dialogue:"制作人！我把界面全重新设计了！沉浸式无UI风格超酷！哦对了，你要的功能界面……我还没做。",choices:[{text:"哇好酷！就用这个！",effects:{progress:-5,morale:10,budget:-8,bossTrust:1,qualityDebt:5},hidden:{quality:-1},result:"测试时玩家找不到任何功能在哪。又重做了。主美很开心。"},{text:"先完成需求，创意留下个版本",effects:{progress:4,morale:-8,budget:0,bossTrust:1},hidden:{judgment:1},result:"主美不开心，但需求按时交付了。"},{text:"保留方向但加基础UI引导",effects:{progress:-2,morale:3,budget:-3,bossTrust:1,qualityDebt:2},hidden:{judgment:1,quality:1},result:"折中方案，视觉和可用性都保住了。"}]},{id:"legacy",name:"屎山",emoji:"🗻",color:"#d97706",tagline:"「在这上面加功能不如重写一个」",situation:"程序发现了一个严重问题：",dialogue:"存档系统要接三年前的老代码，没文档没注释，改一行可能崩十个地方。要做这个功能，必须先重写这部分。",choices:[{text:"重写！不在屎山上建高楼！",effects:{progress:-7,morale:8,budget:-8,bossTrust:2,qualityDebt:-10},hidden:{quality:1,grit:1},result:"重写花了六周。这一个功能的代码终于干净了。"},{text:"小步带防护地改，写测试覆盖",effects:{progress:-2,morale:2,budget:-3,bossTrust:1,qualityDebt:-3},hidden:{quality:1},result:"慢是慢了，但改完了，没崩。稳健但不便宜。"},{text:"这个功能砍掉，规避问题",effects:{progress:3,morale:-6,budget:3,bossTrust:-1,qualityDebt:15},hidden:{honesty:-1},result:"功能砍了，进度和预算都好看了。屎山留给了下一任制作人。"}]},{id:"visionary",name:"远见",emoji:"🔭",color:"#60a5fa",tagline:"「这个系统以后会扩展的」",situation:"主程兴致勃勃地找到你：",dialogue:"制作人，任务系统我重新设计了！考虑到以后可能做开放世界，我搭了个支撑10000任务并发的框架，还有编辑器工具、热更新接口……只需要三个月做基础框架。",choices:[{text:"太有远见了！做！",effects:{progress:-8,morale:10,budget:-12,bossTrust:3,qualityDebt:5},hidden:{quality:-1},result:"三个月后框架搭好了。游戏里还没有一个任务。"},{text:"先做够用的版本，扩展性以后再说",effects:{progress:4,morale:-6,budget:-2,bossTrust:1},hidden:{judgment:1},result:"主程有点受伤，但两周做完了一个能用的系统。"},{text:"保留架构思路，但砍到MVP",effects:{progress:-1,morale:3,budget:-3,bossTrust:2,qualityDebt:3},hidden:{judgment:1,quality:1},result:"框架优雅，功能精简，两边都还能接受。"}]},{id:"meeting",name:"铁头功",emoji:"📅",color:"#0ea5e9",tagline:"「这个、那个，都需要碰头会」",situation:"你打开本周日历，目瞪口呆：",dialogue:"周一全组对齐（2h）+ 周二技术评审（1.5h）+ 周三美术评审（1.5h）+ 周四跨部门同步（1h）+ 周五周总结（1h）+ 明天临时需求评估会。",choices:[{text:"全参加！保持信息同步！",effects:{progress:-4,morale:5,budget:0,bossTrust:1},hidden:{people:1},result:"参加了所有会议。什么正事都没做。但大家觉得你很投入。"},{text:"只参关键会，其余授权组长",effects:{progress:2,morale:-3,budget:0,bossTrust:-1},hidden:{judgment:1},result:"关键信息没丢，大半时间找回来了。组长有点压力。"},{text:"推行异步更新机制，减少会议",effects:{progress:2,morale:-4,budget:-3,bossTrust:1},hidden:{grit:1},result:"效率上来了，但有人不适应，需要磨合成本。"}]},{id:"thunder",name:"雷公",emoji:"⚡",color:"#facc15",tagline:"「这种事我也没法控制」",situation:"突发状况！",dialogue:"公司网络基础设施崩溃，全员居家。Build服务器挂了要修三天。美术组说家里电脑带不动引擎。",choices:[{text:"停工等待恢复",effects:{progress:-6,morale:5,budget:0,bossTrust:-2},hidden:{grit:-1},result:"恢复后大家很有精神。两周白过了。"},{text:"能做什么做什么",effects:{progress:-1,morale:-3,budget:-3,bossTrust:2},hidden:{grit:1},result:"效率减半，但至少在推进。大家都很累。"},{text:"租云端开发环境保效率",effects:{progress:0,morale:8,budget:-12,bossTrust:2},hidden:{people:1,judgment:1},result:"花了不少钱，开发基本没停。团队很感激。"}]},{id:"water_reveal",name:"进度修正",emoji:"💧",color:"#64748b",tagline:"「所以那个数字……」",situation:"你在复盘上个月的里程碑，翻到了一些细节：",dialogue:`那两个「完整关卡」——你亲自去跑测了一下，发现一个是美术场景，没有碰撞体，走进去会穿模；另一个通关逻辑还没写，只能走到中间。
你又打开了当时他们给你的演示视频，确实能跑，但只在那一张专用测试地图上。

这意味着，三周之后，你才能着手开发。原则上这期间开发不能进行依赖此方案的任何功能。`,choices:[{text:"走完全流程，合规操作",effects:{progress:-4,morale:-3,budget:0,bossTrust:3},hidden:{honesty:1},result:"三周后终于批了。你学会了什么叫「等待」。"},{text:"找关键人直接拍板",effects:{progress:-1,morale:0,budget:-5,bossTrust:-1},hidden:{honesty:-1,grit:1},result:"请了个饭，三天搞定。有人在背后说你「不走程序」。"},{text:"先做，边走流程边推进",effects:{progress:2,morale:-3,budget:0,bossTrust:-2,qualityDebt:3},hidden:{honesty:-1},result:"进度推了，但批复下来发现需要改动。还好改动不大。"}]},{id:"market_trend",name:"跟风热",emoji:"🌊",color:"#06b6d4",tagline:"「这个方向现在很热，我们也要做」",situation:"老板看到了一篇爆款分析文章，紧急拉你开会：",dialogue:"《极寒幸存者》这周月流水破亿！生存建造类型现在最热！我们的游戏能不能加入这个元素？或者干脆转型？你来评估一下，下周给我方案。",choices:[{text:"全力融入，方向转型",effects:{progress:-6,morale:3,budget:-5,bossTrust:2,qualityDebt:8},hidden:{judgment:-1},result:"兴奋持续了三天。团队发现转型意味着三个月白干。"},{text:"表面融入，加个「探索模式」",effects:{progress:-2,morale:-2,budget:-3,bossTrust:1,qualityDebt:5},hidden:{honesty:-1},result:"做出了一个四不像。玩家不买账，老板也不满意。"},{text:"礼貌拒绝，坚守核心方向",effects:{progress:2,morale:-5,budget:0,bossTrust:-2},hidden:{judgment:1,grit:1},result:"老板有点不开心。但项目没乱。不久后那个热点凉了。"}]},{id:"bet_deal",name:"对赌协议",emoji:"🎰",color:"#dc2626",tagline:"「本季度营收未达标，全员奖金缩水」",situation:"财务发来一封邮件：",dialogue:"根据对赌协议条款，本季度公司营收未达预期，全员季度奖金将缩水50%。你的项目团队已经知道了这个消息……你没有办法阻止这件事，但你需要应对它。",choices:[{text:"召开全员会议，稳定军心",effects:{progress:-1,morale:-5,budget:0,bossTrust:2},hidden:{people:1},result:"你说了很多鼓励的话。大家礼貌地鼓了掌。士气还是跌了。"},{text:"加大画饼，许诺上线奖励",effects:{progress:1,morale:-3,budget:0,bossTrust:-2,qualityDebt:3},hidden:{honesty:-1},result:"一半人信了。另一半人开始悄悄更新简历。"},{text:"私下里补贴几个核心成员",effects:{progress:1,morale:8,budget:-15,bossTrust:2},hidden:{people:1,grit:1},result:"你赢得了一些信心。代价是项目的预算。"}]},{id:"stock_trap",name:"股票绑架",emoji:"📈",color:"#16a34a",tagline:"「走也不是，留也不是」",situation:"主程私下找到你：",dialogue:"制作人，我有个事……我手上有公司期权，归属期还有8个月，但我已经拿到了一个好offer。走的话期权全没了，但留下来……你懂的，我现在状态确实不太行。",choices:[{text:"留住他，给他更好的条件",effects:{progress:1,morale:-2,budget:-8,bossTrust:3,qualityDebt:3},hidden:{people:1},result:"他留下来了，状态还是不太好。但上面觉得你留住了关键人才。"},{text:"放他走，快速启动交接",effects:{progress:-2,morale:3,budget:-3,bossTrust:2},hidden:{honesty:1,people:1},result:"他感激你的理解。交接很痛苦，但完成后团队反而透了口气。"},{text:"帮他争取调岗，换个环境再撑撑",effects:{progress:-2,morale:5,budget:0,bossTrust:-2},hidden:{people:1},result:"调岗批了，他换了组。你消耗了政治资本，但留住了关系。"}]},{id:"brooks_law",name:"救场招人",emoji:"🧑‍💼",color:"#7c3aed",tagline:"「加人就能加快进度」（真的吗？）",situation:"进度落后，你考虑紧急扩充团队：",dialogue:"HR说有三个候选人可以快速入职。但你的老程序说：「加人只会让我们更慢，至少前一个月。」人月神话你不是没读过……",choices:[{text:"大量招人，相信人海战术",effects:{progress:-4,morale:-5,budget:-10,bossTrust:3,qualityDebt:5},hidden:{judgment:-1},result:"新人带教拖慢了节奏。但老板满意你响应迅速。四周后才看到效果。"},{text:"只招一个最关键岗位",effects:{progress:-1,morale:-2,budget:-5,bossTrust:2},hidden:{judgment:1},result:"带教成本尚可。三周后那个人开始产出。谨慎但有效。"},{text:"不招人，靠现有团队硬扛",effects:{progress:3,morale:-6,budget:0,bossTrust:-1,qualityDebt:3},hidden:{grit:1},result:"团队压力很大，但没有被新人拖慢。进度稳住了。"}]},{id:"kpi_review",name:"KPI施压",emoji:"📉",color:"#9333ea",tagline:"「你觉得这个进度正常吗？」",situation:"季度复盘会上，领导把一个数字推到你面前：",dialogue:"「项目进度看起来……有点慢啊。我们下个季度的KPI目标是这个数，你觉得能完成吗？」那个数字需要你接下来每周产出翻倍。",choices:[{text:"拍胸脯保证，完不成自罚",effects:{progress:1,morale:-5,budget:0,bossTrust:3,qualityDebt:5},hidden:{honesty:-1},result:"领导满意地点头。团队听说了，集体沉默。你用承诺换了信任。"},{text:"如实分析风险，提出可达目标",effects:{progress:1,morale:3,budget:-2,bossTrust:1},hidden:{honesty:1,grit:1},result:"领导皱了皱眉，但接受了合理目标。团队觉得你靠谱。"},{text:"用漂亮的PPT转移注意力",effects:{progress:-1,morale:2,budget:-3,bossTrust:-1,qualityDebt:3},hidden:{honesty:-1},result:"这周做PPT了，没做正事。但领导暂时满意了。"}]},mm],hm=["原型期过去了。方向定了吗？","两个月了。团队开始知道彼此的脾气了。","过半了。但进度过半了吗？","四个月。你开始能感觉到什么东西在收紧。","最后一个月到了。"],Hn=[{id:"m1_review",month:1,name:"立项启动评审",emoji:"🚀",color:"#7678f0",tagline:"「方向定了吗？」",situation:"第一个月末，上面来看原型：",dialogue:"投资方代表坐在会议室里，笑着问：「能跑吗？大概什么感觉？我不需要完整的，能动就行。」你扫了一眼团队——他们昨晚熬通宵做了一个能跑的东西。",choices:[{text:"展示这个能跑的版本",effects:{progress:0,morale:2,budget:2,bossTrust:0,qualityDebt:3},hidden:{honesty:-1},result:"他们满意地点头。你没有告诉他们这是昨晚才做的。"},{text:"如实说明当前进度和风险",effects:{progress:-2,morale:2,budget:0,bossTrust:1},hidden:{honesty:1},result:"他皱了皱眉，但最终点头：「诚实是好事。」进度没虚报，心里稳了。"},{text:"先找人确认这个版本有多少是真实的",effects:{progress:-1,morale:-1,budget:0,bossTrust:1},hidden:{judgment:1},result:"你找人问了。心里大概有底了。"}]},{id:"m2_review",month:2,name:"MVP 评审",emoji:"🎮",color:"#0ea5e9",tagline:"「核心玩法能玩通吗？」",situation:"第二个月末，内部评审：",dialogue:`总监把手柄放下来：「核心循环我玩了十分钟，感觉还行，就是……有几个地方我有点疑问。」

你看了一眼窗外，阴沉沉的天下起了淅淅沥沥的雨。`},bd={id:"zombie_reveal",name:"进度泡沫",emoji:"💣",color:"#ef4444",tagline:"「这进度……你不会真信了吧」",situation:"你深入了解项目后才发现：",dialogue:"所谓「进度40%」，其实包括了：外包的三套废弃美术资产、从没跑通过的技术demo，以及某个策划写的那份永远不会实现的设计文档——对了，那个策划已经离职了，没人记得他叫什么。真实完成度……大概是20%？",choices:[{text:"如实上报，重新规划",effects:{progress:-30,morale:0,budget:0},result:"进度打回原形。你很诚实，但上面很失望。"},{text:"先稳住，内部消化",effects:{progress:-18,morale:-12,budget:0},result:"暂时没穿帮，但团队都知道这个秘密。"},{text:"接受现实，从真实起点出发",effects:{progress:-40,morale:10,budget:0},result:"你坦然接受了一切。团队反而有点佩服你的淡定。"}]},_0={id:"lucid_p1",name:"清醒的人",emoji:"🔬",color:"#e2e8f0",tagline:"「我只是说了实话。」",situation:"全员会议上，主程打断了老板：",dialogue:`「等一下——我觉得你说的不对。」

你来定，招多少都行。

你看了一眼他发来的名单。`,choices:[{text:"好，全部招进来",effects:{progress:-3,morale:-2,budget:8,bossTrust:1,qualityDebt:5},hidden:{judgment:-1},result:"老板很满意，给你批了额外的预算作为补充。HR开始批量面试。你看着那份推荐名单，把它夹进了文件里。",action:"large"},{text:"人不是越多越好，我只招2个关键岗位",effects:{progress:3,morale:2,budget:-2,bossTrust:-1},hidden:{judgment:1},result:"老板接受了你的精打细算。花了点政治资本，至少把规模压下来了。预算也被卡了一点。",action:"small"}]},A0={id:"hire_reveal",name:"新人磨合结束",emoji:"🎲",color:"#a78bfa",tagline:"「培训期结束了。」",situation:"新人开始独立作业，这几周你也看清楚了："},hn=[{id:"dreamer",name:"幻想家",emoji:"✨",color:"#c084fc",tagline:"「我想实现的时候一定会进展顺利」",situation:"幻想家找到你，眼神发亮：",dialogue:"制作人！我昨晚想到了一个超酷的功能——城市建造系统+NPC情绪引擎+实时动态天气！直接对标最近很火的那个猛男捡树枝！我问了朋友，实现起来应该不难的！",choices:[{text:"好主意！加进去！",effects:{progress:-3,morale:-5,budget:8,bossTrust:1,qualityDebt:8},hidden:{judgment:-1},result:"范围扩了，进度变慢，但是预算变高了。团队觉得你是一个耳根子很软的制作人。"},{text:"先写进愿望清单",effects:{progress:3,morale:-4,budget:-1,bossTrust:-2},hidden:{honesty:1},result:"一切如常，幻想家有点失落，私下里说你很会画饼。他离开时没有说再见。"},{text:"做完核心玩法再说",effects:{progress:2,morale:5,budget:-5,bossTrust:-1},hidden:{judgment:1,quality:1},result:"幻想家郁闷地走了。团队很欣赏你的坚定。但上面觉得你不愿突破。"}]},{id:"impulse",name:"灵机一动",emoji:"💡",color:"#fbbf24",tagline:"「我最近玩了一个这个，我们也加一下」",situation:"灵机一动冲进办公室，手机屏幕冲你晃：",dialogue:"我最近在玩《原X》，好可爱！我们也做一个向导角色！还有《白神话》的变身机制！都加上吧！",choices:[{text:"好！美术程序都动起来！",effects:{progress:-2,morale:-8,budget:10,bossTrust:1,qualityDebt:5},hidden:{judgment:-1},result:"美术组和程序组加班加点，团队疲惫不堪。但你们折腾出来的效果为你们换到了一笔预算。"},{text:"做个可行性评估",effects:{progress:-1,morale:-2,budget:-4,bossTrust:3},hidden:{judgment:1,honesty:1},result:"结论：都不可行。浪费了点时间和钱，但总比全做强。"},{text:"我们有自己的方向，专注",effects:{progress:3,morale:-6,budget:-2,bossTrust:1},hidden:{judgment:1},result:"他有点受伤，但项目没偏轨。"}]},{id:"castle",name:"空中楼阁",emoji:"🏰",color:"#38bdf8",tagline:"「先做出来再说，验证是其次」",situation:"空中楼阁把你叫进小会议室，压低声音：",dialogue:"下个月没有内部PV，就拿不到下季度预算！我不管你验证没验证完，先做一版漂亮的Demo出来！",choices:[{text:"好，全员停下来做Demo",effects:{progress:-8,morale:-3,budget:12,bossTrust:2,qualityDebt:20},hidden:{honesty:-1},result:"预算到手了——虽然没要的那么多。核心问题被埋进去，以后会爆的。"},{text:"据理力争拒绝",effects:{progress:2,morale:5,budget:-12,bossTrust:2},hidden:{honesty:1,grit:1},result:"预算缩水了，但进度和士气都保住了。"},{text:"把现有进度包装成Demo",effects:{progress:-3,morale:3,budget:3,bossTrust:-2,qualityDebt:8},hidden:{honesty:-1},result:"小聪明发挥了作用，上面暂时满意了。"}]},{id:"paratrooper",name:"伞兵",emoji:"🪂",color:"#4ade80",tagline:"「我不会乱动的」（但一定会的）",situation:"空降的这位执行制作人听说是老板花了大价钱挖来的，他在全员会议上笑着说：",dialogue:"大家好！我是新来的执行制作人，会辅助制作人把这个内容做好。我觉得你们做得挺好的，会尽量不动大家的东西。对了，我只是有一些小小的方向性调整……",choices:[{text:"当然！洗耳恭听！",effects:{progress:-6,morale:-6,budget:8,bossTrust:3,qualityDebt:5},hidden:{grit:-1},result:"「小小调整」= 三个月白干，方向大变。士气大受挫败，但上面很满意新的效果，批了更多预算。"},{text:"先完成当前里程碑再谈",effects:{progress:5,morale:-3,budget:-3,bossTrust:-3},hidden:{grit:1},result:"争取到了缓冲期。但他记住这事了。从此看你的眼神都多了三分敌意。预算也被卡了。"},{text:"邀请他深入了解实际现状",effects:{progress:2,morale:3,budget:-3,bossTrust:-1},hidden:{people:1},result:"他理解了现状，后来的调整合理了很多。团队觉得你会办事。"}]},{id:"perfectionist",name:"完美主义",emoji:"♾️",color:"#f87171",tagline:"「我们需要重构代码」",situation:"主程发来一份十页技术文档：",dialogue:"制作人，我研究了一下现有架构，技术债非常严重。如果不在这个阶段重构，后期每个功能的开发成本会翻倍。大概需要……六周。",choices:[{text:"重构！代码质量第一！",effects:{progress:-8,morale:10,budget:-8,bossTrust:1,qualityDebt:-10},hidden:{quality:1},result:"六周后代码看起来似乎是干净了，但你看见程序组有几个人看你的目光有点躲闪。"},{text:"局部重构最关键的部分",effects:{progress:-3,morale:5,budget:-5,bossTrust:1,qualityDebt:-3},hidden:{quality:1},result:"折中方案，程序组勉强接受。进度基本没动。"},{text:"先上线，后续版本再还债",effects:{progress:5,morale:-8,budget:3,bossTrust:2,qualityDebt:10},hidden:{honesty:-1},result:"程序组心碎，但项目在往前走。上面挺满意的。"}]},{id:"preacher",name:"布道者",emoji:"📋",color:"#2dd4bf",tagline:"「先建立一套完善的文档流」",situation:"布道者在群里发了一条很长的消息：",dialogue:"继续开发之前，我们应该先对齐需求文档的格式规范，建立完善文档体系。我安排了一个两天的全员工作坊……",choices:[{text:"全员参加！规范很重要！",effects:{progress:-4,morale:5,budget:-8,bossTrust:2},hidden:{quality:1},result:"规范建好了。没有一个人照着用。但大家觉得被尊重了。"},{text:"出个简版规范就好",effects:{progress:-1,morale:-2,budget:-3,bossTrust:1},hidden:{judgment:1},result:"执行率30%，但总比没有强。三方都不满意。"},{text:"这个阶段结束了再搞",effects:{progress:3,morale:-5,budget:0,bossTrust:-1},hidden:{quality:-1},result:"布道者很失望。进度稳住了，但流程债留着了。"}]},{id:"firefighter",name:"救火队",emoji:"🚒",color:"#fb923c",tagline:"「借你50%的美术几个月」",situation:"来自上级的通知：",dialogue:"N项目下个月上线，严重缺人，需要从你们组抽调50%的美术支援三个月。你们的开发计划自行调整一下。",choices:[{text:"以大局为重，送人",effects:{progress:-8,morale:-5,budget:8,bossTrust:3},hidden:{grit:-1},result:"美术走了，但上面记了你的配合。给了点预算补偿。三个月的空档期，还是很难熬。"},{text:"据理力争，只给20%",effects:{progress:-3,morale:2,budget:-5,bossTrust:1},hidden:{grit:1},result:"谈判部分成功，损失减半。上面不太高兴，但团队知道你替他们争取了。"},{text:"换延期批复+资源补偿",effects:{progress:-2,morale:-2,budget:8,bossTrust:-2},hidden:{judgment:1},result:"批了延期，补了点预算。进度算保住了。"}]},{id:"quitter",name:"减员",emoji:"🧳",color:"#94a3b8",tagline:"「我要离开这个伤心的城市」",situation:"核心程序员发来私信：",dialogue:"制作人……我想辞职。我跟女朋友分手了，在这个城市实在待不下去了。战斗系统我会交接好的。",choices:[{text:"升职加薪挽留！",effects:{progress:2,morale:6,budget:-15,bossTrust:-1},hidden:{people:1},result:"他留下来了，进度也稳了。但钱花出去了，心还没完全回来。"},{text:"祝福他，认真做好交接",effects:{progress:-2,morale:-3,budget:-5,bossTrust:3},hidden:{honesty:1,people:1},result:"交接花了三周，新人熟悉又花了一个月。人走了，活儿耽误了。但上面说处理得体。"},{text:"给他批一个月调整假",effects:{progress:-2,morale:10,budget:-8,bossTrust:-1},hidden:{people:1,grit:1},result:"他回来了，状态超好。团队对你刮目相看。"}]},{id:"blamer",name:"甩锅侠",emoji:"🥏",color:"#a78bfa",tagline:"「不是功能没做好，是需求没提清楚」",situation:"程序和策划在项目群里对线起来了：",dialogue:"「功能做错了，两周白费！」「需求文档写得清清楚楚！」「没人看那个破文档！」两边都来找你投诉对方。",choices:[{text:"站程序：策划需求要更清晰",effects:{progress:2,morale:-8,budget:2,bossTrust:-1},hidden:{people:-1},result:"策划崩溃。进度正常推进，但他们开始消极怠工。上面觉得你偏心。"},{text:"站策划：程序要主动沟通",effects:{progress:0,morale:-6,budget:3,bossTrust:-2},hidden:{people:-1},result:"程序组寒心，开始只按字面意思做需求，进度也慢了点。"},{text:"拉双方当面对齐，建沟通机制",effects:{progress:-3,morale:8,budget:-5,bossTrust:1},hidden:{people:1,judgment:1},result:"握手言和，建立了每周小对齐机制。这周白费了，但长远受益。"}]},{id:"cowboy",name:"自由发挥",emoji:"🤠",color:"#f97316",tagline:"「我这么设计，耽误你的需求吗？」",situation:"主美做完了一个月的UI给你看效果：",dialogue:"制作人！我把界面全重新设计了！沉浸式无UI风格超酷！哦对了，你要的功能界面……我还没做。",choices:[{text:"哇好酷！就用这个！",effects:{progress:-5,morale:10,budget:-8,bossTrust:1,qualityDebt:5},hidden:{quality:-1},result:"测试时玩家找不到任何功能在哪。又重做了。主美很开心。"},{text:"先完成需求，创意留下个版本",effects:{progress:4,morale:-8,budget:0,bossTrust:1},hidden:{judgment:1},result:"主美不开心，但需求按时交付了。"},{text:"保留方向但加基础UI引导",effects:{progress:-2,morale:3,budget:-3,bossTrust:1,qualityDebt:2},hidden:{judgment:1,quality:1},result:"折中方案，视觉和可用性都保住了。"}]},{id:"legacy",name:"屎山",emoji:"🗻",color:"#d97706",tagline:"「在这上面加功能不如重写一个」",situation:"程序发现了一个严重问题：",dialogue:"存档系统要接三年前的老代码，没文档没注释，改一行可能崩十个地方。要做这个功能，必须先重写这部分。",choices:[{text:"重写！不在屎山上建高楼！",effects:{progress:-7,morale:8,budget:-8,bossTrust:2,qualityDebt:-10},hidden:{quality:1,grit:1},result:"重写花了六周。这一个功能的代码终于干净了。"},{text:"小步带防护地改，写测试覆盖",effects:{progress:-2,morale:2,budget:-3,bossTrust:1,qualityDebt:-3},hidden:{quality:1},result:"慢是慢了，但改完了，没崩。稳健但不便宜。"},{text:"这个功能砍掉，规避问题",effects:{progress:3,morale:-6,budget:3,bossTrust:-1,qualityDebt:15},hidden:{honesty:-1},result:"功能砍了，进度和预算都好看了。屎山留给了下一任制作人。"}]},{id:"visionary",name:"远见",emoji:"🔭",color:"#60a5fa",tagline:"「这个系统以后会扩展的」",situation:"主程兴致勃勃地找到你：",dialogue:"制作人，任务系统我重新设计了！考虑到以后可能做开放世界，我搭了个支撑10000任务并发的框架，还有编辑器工具、热更新接口……只需要三个月做基础框架。",choices:[{text:"太有远见了！做！",effects:{progress:-8,morale:10,budget:-12,bossTrust:3,qualityDebt:5},hidden:{quality:-1},result:"三个月后框架搭好了。游戏里还没有一个任务。"},{text:"先做够用的版本，扩展性以后再说",effects:{progress:4,morale:-6,budget:-2,bossTrust:1},hidden:{judgment:1},result:"主程有点受伤，但两周做完了一个能用的系统。"},{text:"保留架构思路，但砍到MVP",effects:{progress:-1,morale:3,budget:-3,bossTrust:2,qualityDebt:3},hidden:{judgment:1,quality:1},result:"框架优雅，功能精简，两边都还能接受。"}]},{id:"meeting",name:"铁头功",emoji:"📅",color:"#0ea5e9",tagline:"「这个、那个，都需要碰头会」",situation:"你打开本周日历，目瞪口呆：",dialogue:"周一全组对齐（2h）+ 周二技术评审（1.5h）+ 周三美术评审（1.5h）+ 周四跨部门同步（1h）+ 周五周总结（1h）+ 明天临时需求评估会。",choices:[{text:"全参加！保持信息同步！",effects:{progress:-4,morale:5,budget:0,bossTrust:1},hidden:{people:1},result:"参加了所有会议。什么正事都没做。但大家觉得你很投入。"},{text:"只参关键会，其余授权组长",effects:{progress:2,morale:-3,budget:0,bossTrust:-1},hidden:{judgment:1},result:"关键信息没丢，大半时间找回来了。组长有点压力。"},{text:"推行异步更新机制，减少会议",effects:{progress:2,morale:-4,budget:-3,bossTrust:1},hidden:{grit:1},result:"效率上来了，但有人不适应，需要磨合成本。"}]},{id:"thunder",name:"雷公",emoji:"⚡",color:"#facc15",tagline:"「这种事我也没法控制」",situation:"突发状况！",dialogue:"公司网络基础设施崩溃，全员居家。Build服务器挂了要修三天。美术组说家里电脑带不动引擎。",choices:[{text:"停工等待恢复",effects:{progress:-6,morale:5,budget:0,bossTrust:-2},hidden:{grit:-1},result:"恢复后大家很有精神。两周白过了。"},{text:"能做什么做什么",effects:{progress:-1,morale:-3,budget:-3,bossTrust:2},hidden:{grit:1},result:"效率减半，但至少在推进。大家都很累。"},{text:"租云端开发环境保效率",effects:{progress:0,morale:8,budget:-12,bossTrust:2},hidden:{people:1,judgment:1},result:"花了不少钱，开发基本没停。团队很感激。"}]},{id:"water_reveal",name:"进度修正",emoji:"💧",color:"#64748b",tagline:"「所以那个数字……」",situation:"你在复盘上个月的里程碑，翻到了一些细节：",dialogue:`那两个「完整关卡」——你亲自去跑测了一下，发现一个是美术场景，没有碰撞体，走进去会穿模；另一个通关逻辑还没写，只能走到中间。
你又打开了当时他们给你的演示视频，确实能跑，但只在那一张专用测试地图上。

:"放他走，快速启动交接",effects:{progress:-2,morale:3,budget:-3,bossTrust:2},hidden:{honesty:1,people:1},result:"他感激你的理解。交接很痛苦，但完成后团队反而透了口气。"},{text:"帮他争取调岗，换个环境再撑撑",effects:{progress:-2,morale:5,budget:0,bossTrust:-2},hidden:{people:1},result:"调岗批了，他换了组。你消耗了政治资本，但留住了关系。"}]},{id:"brooks_law",name:"救场招人",emoji:"🧑‍💼",color:"#7c3aed",tagline:"「加人就能加快进度」（真的吗？）",situation:"进度落后，你考虑紧急扩充团队：",dialogue:"HR说有三个候选人可以快速入职。但你的老程序说：「加人只会让我们更慢，至少前一个月。」人月神话你不是没读过……",choices:[{text:"大量招人，相信人海战术",effects:{progress:-4,morale:-5,budget:-10,bossTrust:3,qualityDebt:5},hidden:{judgment:-1},result:"新人带教拖慢了节奏。但老板满意你响应迅速。四周后才看到效果。"},{text:"只招一个最关键岗位",effects:{progress:-1,morale:-2,budget:-5,bossTrust:2},hidden:{judgment:1},result:"带教成本尚可。三周后那个人开始产出。谨慎但有效。"},{text:"不招人，靠现有团队硬扛",effects:{progress:3,morale:-6,budget:0,bossTrust:-1,qualityDebt:3},hidden:{grit:1},result:"团队压力很大，但没有被新人拖慢。进度稳住了。"}]},{id:"kpi_review",name:"KPI施压",emoji:"📉",color:"#9333ea",tagline:"「你觉得这个进度正常吗？」",situation:"季度复盘会上，领导把一个数字推到你面前：",dialogue:"「项目进度看起来……有点慢啊。我们下个季度的KPI目标是这个数，你觉得能完成吗？」那个数字需要你接下来每周产出翻倍。",choices:[{text:"拍胸脯保证，完不成自罚",effects:{progress:1,morale:-5,budget:0,bossTrust:3,qualityDebt:5},hidden:{honesty:-1},result:"领导满意地点头。团队听说了，集体沉默。你用承诺换了信任。"},{text:"如实分析风险，提出可达目标",effects:{progress:1,morale:3,budget:-2,bossTrust:1},hidden:{honesty:1,grit:1},result:"领导皱了皱眉，但接受了合理目标。团队觉得你靠谱。"},{text:"用漂亮的PPT转移注意力",effects:{progress:-1,morale:2,budget:-3,bossTrust:-1,qualityDebt:3},hidden:{honesty:-1},result:"这周做PPT了，没做正事。但领导暂时满意了。"}]},B0],D0=["原型期过去了。方向定了吗？","两个月了。团队开始知道彼此的脾气了。","过半了。但进度过半了吗？","四个月。你开始能感觉到什么东西在收紧。","最后一个月到了。"],bo=[{id:"m1_review",month:1,name:"立项启动评审",emoji:"🚀",color:"#7678f0",tagline:"「方向定了吗？」",situation:"第一个月末，上面来看原型：",dialogue:"投资方代表坐在会议室里，笑着问：「能跑吗？大概什么感觉？我不需要完整的，能动就行。」你扫了一眼团队——他们昨晚熬通宵做了一个能跑的东西。",choices:[{text:"展示这个能跑的版本",effects:{progress:0,morale:2,budget:2,bossTrust:0,qualityDebt:3},hidden:{honesty:-1},result:"他们满意地点头。你没有告诉他们这是昨晚才做的。"},{text:"如实说明当前进度和风险",effects:{progress:-2,morale:2,budget:0,bossTrust:1},hidden:{h
